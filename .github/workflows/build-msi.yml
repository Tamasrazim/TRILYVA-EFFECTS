name: Build TRILYVA EDIT MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX Toolset v4
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (Get-Content VERSION -Raw).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be numeric major.minor.patch, got: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build x64 MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build installer/Product.wxs `
            -arch x64 `
            -d ProductVersion=$env:APP_VERSION `
            -bindpath SourceDir=extension `
            -o "dist/TRILYVA-EDIT-Setup-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX failed with exit code $LASTEXITCODE" }
          Get-Item "dist/TRILYVA-EDIT-Setup-x64.msi" | Format-List Name,Length,FullName

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRILYVA-EDIT-Setup-x64
          path: dist/TRILYVA-EDIT-Setup-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TRILYVA-EDIT-Setup-x64.msi
          generate_release_notes: true
